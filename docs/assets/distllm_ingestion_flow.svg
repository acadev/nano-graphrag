<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .card-title { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; ry: 14; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 22; ry: 22; }
      .accent-pdf { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; ry: 14; }
      .accent-distllm { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; rx: 14; ry: 14; }
      .accent-bridge { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 14; ry: 14; }
      .accent-graph { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 14; ry: 14; }
      .accent-ontology { fill: #fdf4ff; stroke: #a855f7; stroke-width: 2; rx: 14; ry: 14; }
      .accent-qa { fill: #fff1f2; stroke: #fb7185; stroke-width: 2; rx: 14; ry: 14; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow-soft); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="620"/>
  <text x="56" y="64" class="title">Ingestion: distllm to Neo4j knowledge graph</text>
  <text x="56" y="96" class="subtitle">Offline pipeline that builds the graph substrate consumed by the QA system map above. Independent of, and feeds, that runtime.</text>

  <rect class="lane" x="44" y="130" width="1352" height="320" filter="url(#shadow)"/>
  <text x="64" y="162" class="lane-title">Build pipeline (Aurora / Polaris, Parsl-orchestrated)</text>

  <!-- PDF corpus -->
  <rect class="accent-pdf" x="64" y="190" width="230" height="220"/>
  <text x="84" y="222" class="card-title">PDF corpus</text>
  <text x="84" y="246" class="card-body">pdfwf parses PDFs to JSONL:</text>
  <text x="84" y="266" class="card-body">{"path", "text", "metadata"}</text>
  <text x="84" y="296" class="card-body">e.g. low-dose-radiation-cancer/</text>
  <text x="84" y="316" class="card-body">ldr_dna_repair, ldr_carcinogenesis,</text>
  <text x="84" y="336" class="card-body">ldr_physics_biology,</text>
  <text x="84" y="356" class="card-body">ldr_somatic_mutation</text>
  <text x="84" y="392" class="tiny">github.com/ramanathanlab/pdfwf</text>

  <path class="arrow" d="M294,300 L334,300"/>

  <!-- distllm -->
  <rect class="accent-distllm" x="334" y="190" width="270" height="220"/>
  <text x="354" y="222" class="card-title">distllm embed</text>
  <text x="354" y="246" class="card-body">SFR-Embedding-Mistral semantic</text>
  <text x="354" y="266" class="card-body">chunking (cosine-similarity sentence</text>
  <text x="354" y="286" class="card-body">grouping, mixed-science domain).</text>
  <text x="354" y="316" class="card-body">Writes HF Arrow shards:</text>
  <text x="354" y="336" class="card-body">{"text", "embedding", "path"}</text>
  <text x="354" y="372" class="tiny">configs/aurora_sfr_mistral_</text>
  <text x="354" y="390" class="tiny">radiation_biology.yaml</text>

  <path class="arrow" d="M604,300 L644,300"/>

  <!-- bridge -->
  <rect class="accent-bridge" x="644" y="190" width="280" height="220"/>
  <text x="664" y="222" class="card-title">_distllm_bridge</text>
  <text x="664" y="246" class="card-body">build_chunks_from_distllm -&gt;</text>
  <text x="664" y="266" class="card-body">TextChunkSchema + full_docs</text>
  <text x="664" y="296" class="card-body">wrap_precomputed_embeddings -&gt;</text>
  <text x="664" y="316" class="card-body">EmbeddingFunc (SFR-Mistral cache,</text>
  <text x="664" y="336" class="card-body">live fallback for new text)</text>
  <text x="664" y="372" class="tiny">nano_graphrag/_distllm_bridge.py</text>
  <text x="664" y="390" class="tiny">ainsert_distllm_chunks(rag, ...)</text>

  <path class="arrow" d="M924,300 L964,300"/>

  <!-- nano-graphrag entity extraction -->
  <rect class="accent-graph" x="964" y="190" width="270" height="220"/>
  <text x="984" y="222" class="card-title">nano-graphrag indexing</text>
  <text x="984" y="246" class="card-body">extract_entities (LLM, with</text>
  <text x="984" y="266" class="card-body">heuristic fallback) -&gt; entity-level</text>
  <text x="984" y="286" class="card-body">nodes/edges with provenance</text>
  <text x="984" y="316" class="card-body">clustering("leiden") via Neo4j GDS</text>
  <text x="984" y="336" class="card-body">-&gt; concept-cluster communities</text>
  <text x="984" y="372" class="tiny">nano_graphrag/_extraction.py,</text>
  <text x="984" y="390" class="tiny">_storage/gdb_neo4j.py</text>

  <path class="arrow" d="M1099,410 L1099,450 L294,450 L294,410"/>
  <text x="320" y="442" class="tiny">community reports feed ontology alignment (below)</text>

  <!-- bottom lane -->
  <rect class="lane" x="44" y="470" width="1352" height="120" filter="url(#shadow)"/>
  <text x="64" y="500" class="lane-title">Concept-cluster / ontology layer + QA runtime</text>

  <rect class="accent-ontology" x="64" y="514" width="420" height="60"/>
  <text x="84" y="538" class="card-title">align_communities_to_ontology</text>
  <text x="84" y="558" class="card-body">matches Leiden communities to graph_metadata.json entity/relationship types (e.g. DNA_LESION, REPAIR_PATHWAY)</text>

  <path class="arrow" d="M484,544 L524,544"/>

  <rect class="accent-graph" x="524" y="514" width="320" height="60"/>
  <text x="544" y="538" class="card-title">Neo4j graph storage</text>
  <text x="544" y="558" class="card-body">entity nodes + ontology_concept / ontology_kg_id properties</text>

  <path class="arrow" d="M844,544 L884,544"/>

  <rect class="accent-qa" x="884" y="514" width="480" height="60"/>
  <text x="904" y="538" class="card-title">QA system map (above)</text>
  <text x="904" y="558" class="card-body">RAG and GASL modes query this graph via gasl/adapters/</text>
</svg>
